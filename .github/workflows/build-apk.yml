name: Build AppLocker APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # Gradle 8.7
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true


      # --------------------------------------------------
      # Find Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Searching for Android project..."

          # Case 1:
          # Project is already at repository root
          if [ -f "./settings.gradle.kts" ] && [ -f "./app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"

          # Case 2:
          # Project is inside AppLocker/
          elif [ -f "./AppLocker/settings.gradle.kts" ] && [ -f "./AppLocker/app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/AppLocker"

          # Case 3:
          # AppLocker.zip is stored in repository
          elif [ -f "./AppLocker.zip" ]; then
            echo "AppLocker.zip found."
            echo "Extracting project..."

            mkdir -p "$GITHUB_WORKSPACE/build-source"

            unzip -q "./AppLocker.zip" -d "$GITHUB_WORKSPACE/build-source"

            if [ -f "$GITHUB_WORKSPACE/build-source/AppLocker/settings.gradle.kts" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/build-source/AppLocker"

            elif [ -f "$GITHUB_WORKSPACE/build-source/settings.gradle.kts" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

            else
              echo "ERROR: settings.gradle.kts was not found inside AppLocker.zip."
              find "$GITHUB_WORKSPACE/build-source" -maxdepth 4 -type f | sort
              exit 1
            fi

          else
            echo "ERROR: Android project could not be located."
            echo ""
            echo "Expected one of:"
            echo "  ./settings.gradle.kts"
            echo "  ./AppLocker/settings.gradle.kts"
            echo "  ./AppLocker.zip"
            exit 1
          fi

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # Verify project files
      # --------------------------------------------------
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

          echo ""

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Project structure is valid."


      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo ""

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # --------------------------------------------------
      # Find generated APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "All APK files:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # Show APK information
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$APK_PATH"

          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          ls -lh "$APK_PATH"


      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLocker-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
