name: Build AppLocker APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build APK
        working-directory: AppLocker
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Verify APK
        working-directory: AppLocker
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLocker-debug
          path: AppLocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
