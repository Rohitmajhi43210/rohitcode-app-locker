name: Build AppLocker APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      # 4. Show repository structure
      - name: Check repository
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      # 5. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts was not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi

          echo "Android project structure looks correct."

      # 6. Show Java and Gradle versions
      - name: Verify build environment
        shell: bash
        run: |
          java -version
          echo ""
          gradle --version

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
