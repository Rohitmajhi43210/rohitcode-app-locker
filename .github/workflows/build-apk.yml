````yaml
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 2. Install Java 17
      # Android Gradle Plugin 8.5.2 requires Java 17.
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Install Android SDK
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      # ---------------------------------------------------------
      # 4. Configure Gradle
      #
      # Your project does not currently contain gradlew.
      # Gradle 8.7 is compatible with Android Gradle Plugin 8.5.2.
      # ---------------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # ---------------------------------------------------------
      # 5. Verify build environment
      # ---------------------------------------------------------
      - name: Show build environment
        run: |
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      # ---------------------------------------------------------
      # 6. Verify Android SDK packages
      # ---------------------------------------------------------
      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-34|build-tools;34.0.0" \
            || true

      # ---------------------------------------------------------
      # 7. Build DEBUG APK
      #
      # The uploaded ZIP contains:
      #
      # AppLocker/
      # ├── build.gradle.kts
      # ├── settings.gradle.kts
      # └── app/
      #
      # If you place these files directly in the repository root,
      # change "working-directory" to ".".
      # ---------------------------------------------------------
      - name: Build debug APK
        working-directory: AppLocker
        run: |
          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean assembleDebug

      # ---------------------------------------------------------
      # 8. Find generated APK
      # ---------------------------------------------------------
      - name: Verify APK
        working-directory: AppLocker
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo
            echo "Available APK files:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ---------------------------------------------------------
      # 9. Upload APK to GitHub Actions
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AppLocker-debug-apk
          path: AppLocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
