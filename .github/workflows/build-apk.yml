name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build AppLocker APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle 8.7
      # AGP 8.5.2 used by this project is compatible with Gradle 8.7.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Verify Java and Gradle
      - name: Verify build environment
        run: |
          java -version
          gradle --version

      # 5. Make sure Android SDK components required by the project exist
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 6. Check Gradle configuration before building
      - name: Validate Gradle configuration
        working-directory: AppLocker
        run: |
          gradle tasks --no-daemon --stacktrace

      # 7. Build debug APK
      - name: Build debug APK
        working-directory: AppLocker
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 8. Verify APK actually exists
      - name: Verify APK
        working-directory: AppLocker
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLocker-debug-apk
          path: AppLocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
